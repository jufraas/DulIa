<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>body{height:170px}</style></head>
<body><div class="card" style="height:170px">
<div class="row" style="gap:10px">

  <div class="swatch" style="flex:1">
    <div class="chip" style="background:#34D399;height:90px"></div>
    <div class="lbl"><b>success</b><span>#34D399</span></div></div>
  <div class="swatch" style="flex:1">
    <div class="chip" style="background:#FBBF24;height:90px"></div>
    <div class="lbl"><b>warning</b><span>#FBBF24</span></div></div>
  <div class="swatch" style="flex:1">
    <div class="chip" style="background:#F87171;height:90px"></div>
    <div class="lbl"><b>danger</b><span>#F87171</span></div></div>
  <div class="swatch" style="flex:1">
    <div class="chip" style="background:#60A5FA;height:90px"></div>
    <div class="lbl"><b>info</b><span>#60A5FA</span></div></div>
</div></div></body></html>
