<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>body{height:290px}</style></head>
<body><div class="card" style="height:290px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
  <div style="background:var(--bg-2);border:1px solid rgba(168,85,247,0.35);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(168,85,247,0.10),0 8px 32px rgba(124,58,237,0.18)">
    <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#7C3AED,#C084FC);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(124,58,237,0.45)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 10 10"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
    </div>
    <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--fg-1);margin-bottom:6px">Coach IA</div>
    <div style="font-family:'Inter',sans-serif;font-size:14px;color:var(--fg-3);line-height:1.5">Análisis personalizado de tu perfil con feedback accionable.</div>
  </div>
  <div style="background:var(--bg-2);border:1px solid rgba(168,85,247,0.45);border-radius:20px;padding:20px;box-shadow:0 0 0 1px rgba(168,85,247,0.20),0 14px 44px rgba(124,58,237,0.35);transform:translateY(-2px)">
    <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#EC4899,#A855F7);display:flex;align-items:center;justify-content:center;margin-bottom:14px;box-shadow:0 8px 22px rgba(236,72,153,0.45)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 12l2 2 4-4"/></svg>
    </div>
    <div style="font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:var(--fg-1);margin-bottom:6px">Score 0–100</div>
    <div style="font-family:'Inter',sans-serif;font-size:14px;color:var(--fg-3);line-height:1.5">Tu nivel de empleabilidad medido contra el mercado real.</div>
  </div>
</div>
<div style="display:flex;gap:18px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">
  <span>default</span><span>·</span><span>hover (translateY -2px + glow strong)</span>
</div></div></body></html>
