<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ring-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"></stop>
      <stop offset="55%" stop-color="#A855F7"></stop>
      <stop offset="100%" stop-color="#C084FC"></stop>
    </linearGradient>
    <linearGradient id="ring-spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F472B6"></stop>
      <stop offset="100%" stop-color="#EC4899"></stop>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"></feGaussianBlur>
    </filter>
  </defs>

  
  <circle cx="32" cy="32" r="22" fill="none" stroke="url(#ring-brand)" stroke-width="7" stroke-linecap="round" stroke-dasharray="103.7 138.2" transform="rotate(-50 32 32)"></circle>

  
  <circle cx="32" cy="32" r="5" fill="url(#ring-brand)" opacity="0.9"></circle>

  
  <g transform="translate(50 14)">
    <path d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z" fill="url(#ring-spark)" filter="url(#glow)"></path>
    <path d="M0 -8 L2.2 -2.2 L8 0 L2.2 2.2 L0 8 L-2.2 2.2 L-8 0 L-2.2 -2.2 Z" fill="url(#ring-spark)"></path>
  </g>
</svg>