<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>body{height:270px}</style></head>
<body><div class="card" style="height:270px">
<style>
@keyframes ease-out-demo { 0% { transform: translateX(0); opacity: 0 } 100% { transform: translateX(580px); opacity: 1 } }
@keyframes ease-bounce-demo { 0% { transform: scale(0.7); opacity: 0 } 100% { transform: scale(1); opacity: 1 } }
.dot-a { animation: ease-out-demo 2.2s cubic-bezier(0.16,1,0.30,1) infinite alternate; }
.dot-b { animation: ease-bounce-demo 1.6s cubic-bezier(0.34,1.56,0.64,1) infinite alternate; }
</style>
<div class="eyebrow" style="color:var(--violet-300);font-family:var(--font-body);font-size:12px;letter-spacing:0.14em;text-transform:uppercase;font-weight:600">Motion · easings</div>
<div>
  <div style="font-family:var(--font-body);font-size:13px;color:var(--fg-2);margin-bottom:6px">ease-out · default · <span style="font-family:var(--font-mono);color:var(--fg-3)">cubic-bezier(0.16, 1, 0.30, 1)</span></div>
  <div style="height:28px;background:var(--bg-2);border-radius:14px;position:relative;overflow:hidden">
    <div class="dot-a" style="position:absolute;left:8px;top:8px;width:32px;height:12px;border-radius:6px;background:linear-gradient(90deg,#7C3AED,#C084FC)"></div>
  </div>
</div>
<div>
  <div style="font-family:var(--font-body);font-size:13px;color:var(--fg-2);margin-bottom:6px">ease-bounce · confirmaciones · <span style="font-family:var(--font-mono);color:var(--fg-3)">cubic-bezier(0.34, 1.56, 0.64, 1)</span></div>
  <div style="height:48px;background:var(--bg-2);border-radius:14px;display:flex;align-items:center;justify-content:center">
    <div class="dot-b" style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#EC4899,#A855F7);box-shadow:0 0 24px rgba(236,72,153,0.6)"></div>
  </div>
</div>
<div style="display:flex;gap:12px;font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">
  <span>fast 140ms</span><span>·</span><span>base 220ms</span><span>·</span><span>slow 420ms</span>
</div></div></body></html>
