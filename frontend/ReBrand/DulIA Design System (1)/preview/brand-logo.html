<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>body{height:290px}</style></head>
<body><div class="card" style="height:290px">
<div style="display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:14px;padding:20px;border:1px solid rgba(168,85,247,0.20)">
  <img src="../assets/dulia-logo.svg" alt="DulIA" style="height:50px"/>
</div>
<div style="display:flex;gap:14px;align-items:center">
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:52px;height:52px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:14px;border:1px solid rgba(168,85,247,0.20)">
        <img src="../assets/dulia-mark.svg" style="width:28px;height:28px"/>
      </div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">28px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:72px;height:72px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:14px;border:1px solid rgba(168,85,247,0.20)">
        <img src="../assets/dulia-mark.svg" style="width:48px;height:48px"/>
      </div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">48px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:96px;height:96px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:14px;border:1px solid rgba(168,85,247,0.20)">
        <img src="../assets/dulia-mark.svg" style="width:72px;height:72px"/>
      </div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">72px</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <div style="width:132px;height:132px;display:flex;align-items:center;justify-content:center;background:var(--bg-2);border-radius:14px;border:1px solid rgba(168,85,247,0.20)">
        <img src="../assets/dulia-mark.svg" style="width:108px;height:108px"/>
      </div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--fg-3)">108px</span>
    </div>
  <div style="flex:1;padding-left:8px;border-left:1px solid rgba(168,85,247,0.18)">
    <div style="font-family:'Inter',sans-serif;font-size:13px;color:var(--fg-2);line-height:1.5">
      <b style="color:var(--violet-300)">Isotipo:</b> arco 270° en gradiente brand + núcleo + destello magenta de cuatro puntas. Evoca el score-ring + sparkle del coach IA. Lee como <b style="color:var(--fg-1)">D</b> a cualquier tamaño.
    </div>
  </div>
</div></div></body></html>
