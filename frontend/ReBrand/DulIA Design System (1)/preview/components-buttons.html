<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_preview.css">
<style>body{height:200px}</style></head>
<body><div class="card" style="height:200px">

  <span style="display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(236,72,153,0.14);border:1px solid rgba(236,72,153,0.35);font-family:var(--font-body);font-size:12px;font-weight:600;color:#F9A8D4">★ Nuevo</span>
