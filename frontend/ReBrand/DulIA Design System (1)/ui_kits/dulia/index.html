<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DulIA — UI Kit</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/dulia-mark.svg">
  <link rel="stylesheet" href="kit.css">

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div class="atmosphere"></div>
  <div id="app"></div>

  <script type="text/babel" src="components.jsx"></script>
  <script type="text/babel" src="Landing.jsx"></script>
  <script type="text/babel" src="Wizard.jsx"></script>
  <script type="text/babel" src="Results.jsx"></script>
  <script type="text/babel" src="Vacancies.jsx"></script>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      // route: home | wizard | results | vacancies
      const initial = (typeof location !== "undefined" && location.hash.replace("#","")) || "home";
      const [route, setRoute] = useState(initial);
      const [profile, setProfile] = useState(null);

      const go = (r) => {
        setRoute(r);
        if (typeof window !== "undefined") {
          window.scrollTo({ top: 0, behavior: "instant" });
          history.replaceState(null, "", "#" + r);
        }
      };

      if (route === "wizard") {
        return <window.Wizard
          onDone={(d) => { setProfile(d); go("results"); }}
          onBack={() => go("home")}/>;
      }
      if (route === "results") {
        return <window.Results data={profile} onBack={() => go("home")} onVacancies={() => go("vacancies")}/>;
      }
      if (route === "vacancies") {
        return <window.Vacancies onBack={() => go("results")}/>;
      }
      return <window.Landing onStart={() => go("wizard")} onVacancies={() => go("vacancies")}/>;
    }

    ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
  </script>
</body>
</html>
